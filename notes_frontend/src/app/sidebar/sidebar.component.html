<mat-nav-list>
  <a mat-list-item (click)="selectCategory(null)" [class.active]="!selectedCategory">All Notes</a>
  <a mat-list-item *ngFor="let cat of categories"
     (click)="selectCategory(cat)"
     [class.active]="selectedCategory === cat">
    <mat-icon matListIcon>label</mat-icon>
    <span>{{ cat }}</span>
  </a>
</mat-nav-list>
